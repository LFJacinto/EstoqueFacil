services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://estoque:estoque@banco:5432/estoque
      CUSTEIO: custo-medio
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados:
